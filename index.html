.palette b{font-weight:600}.palette span{color:var(--mut);font-size:.82rem;display:block}

.range{margin:16px 0}.range label{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem}.range output{color:var(--glow);font-weight:600}

/* ================= CLIENT SITE (tokens + layout archetypes) ================= */

// ================= color science =================
function lin(L,C,h){const a=C*Math.cos(h*Math.PI/180),b=C*Math.sin(h*Math.PI/180);const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;
 return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];}
const inG=v=>v.every(x=>x>=-1e-7&&x<=1+1e-7);
function fit([L,C,h]){let lo=0,hi=Math.max(0,C);if(inG(lin(L,hi,h)))return [L,hi,h];
 for(let i=0;i<20;i++){const mid=(lo+hi)/2;if(inG(lin(L,mid,h)))lo=mid;else hi=mid;}return [L,lo,h];}
const Y=c=>{const v=lin(...c).map(x=>Math.min(1,Math.max(0,x)));return .2126*v[0]+.7152*v[1]+.0722*v[2];};
const CR=(a,b)=>{const x=Y(a),y=Y(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const css=([L,C,h])=>`oklch(${(L*100).toFixed(1)}% ${C.toFixed(3)} ${h})`;
const hex=c=>'#'+lin(...c).map(x=>{x=Math.min(1,Math.max(0,x));x=x<=.0031308?12.92*x:1.055*x**(1/2.4)-.055;return Math.round(x*255).toString(16).padStart(2,'0');}).join('');
function readable(fg,bg,min=4.5){let c=fg.slice();const dark=Y(bg)<.2;for(let i=0;i<40&&CR(c,bg)<min;i++)c=[Math.min(.99,Math.max(.05,c[0]+(dark?.02:-.02))),c[1],c[2]];return c;}

 row.innerHTML=html;row.setAttribute('aria-labelledby','mTab-'+mTab);document.querySelectorAll('[data-mtab]').forEach(b=>{const selected=b.dataset.mtab===mTab;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;});

const previewViewport=document.getElementById('vp');let drag=null,suppressPreviewClick=0;
previewViewport.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;suppressPreviewClick=0;if(e.target.closest('button,a,input,textarea,select,[contenteditable="true"]'))return;
 e.preventDefault();

function finishPreviewDrag(e){if(!drag)return;const d=drag;drag=null;
 let snap;
 if(d.axis==='x'&&e?.type==='pointerup'){const area=d.area,max=area.scrollWidth-area.clientWidth,first=area.children[0]?.offsetLeft||0;
  const stops=[...new Set([...area.children].map(c=>Math.max(0,Math.min(max,c.offsetLeft-first))))].sort((a,b)=>a-b),nearest=value=>stops.reduce((a,b)=>Math.abs(b-value)<Math.abs(a-value)?b:a,stops[0]||0);
  const origin=nearest(d.left),moved=area.scrollLeft-d.left;let target=nearest(area.scrollLeft);

 if(previewViewport.hasPointerCapture(d.pointer))previewViewport.releasePointerCapture(d.pointer);}
